# ============================================================================
# HiT-IDS: Hierarchical Transformer with Intrinsic Explainability for IDS
# Master Configuration File
# ============================================================================

# --- Project Info ---
project:
  name: "HiT-IDS-np2"
  description: "Hierarchical Transformer with Intrinsic Explainability for Network Intrusion Detection"
  seed: 42
  device: "cuda"  # "cuda" or "cpu"

# --- Paths ---
paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  splits: "data/splits"
  checkpoints: "results/checkpoints"
  figures: "results/figures"
  tables: "results/tables"
  logs: "results/logs"

# --- Dataset ---
dataset:
  name: "CIC-IDS2017"
  # Columns to drop (identifiers, not features)
  drop_columns:
    - "Flow ID"
    - "Source IP"
    - "Source Port"
    - "Destination IP"
    - "Timestamp"
  label_column: "Label"
  # Label mapping
  label_map:
    "BENIGN": 0
    "Bot": 1
    "DDoS": 2
    "DoS GoldenEye": 3
    "DoS Hulk": 4
    "DoS Slowhttptest": 5
    "DoS slowloris": 6
    "FTP-Patator": 7
    "Heartbleed": 8
    "Infiltration": 9
    "PortScan": 10
    "SSH-Patator": 11
    "Web Attack - Brute Force": 12
    "Web Attack - Sql Injection": 13
    "Web Attack - XSS": 14
  num_classes: 15

# --- Feature Groups (Core Architectural Innovation) ---
feature_groups:
  temporal:
    - "Flow Duration"
    - "Fwd IAT Total"
    - "Fwd IAT Mean"
    - "Fwd IAT Std"
    - "Fwd IAT Max"
    - "Fwd IAT Min"
    - "Bwd IAT Total"
    - "Bwd IAT Mean"
    - "Bwd IAT Std"
    - "Bwd IAT Max"
    - "Bwd IAT Min"
    - "Active Mean"
    - "Active Std"
    - "Active Max"
    - "Active Min"
    - "Idle Mean"
    - "Idle Std"
    - "Idle Max"
    - "Idle Min"
    - "Flow IAT Mean"
    - "Flow IAT Std"
    - "Flow IAT Max"
    - "Flow IAT Min"
  volume:
    - "Total Fwd Packets"
    - "Total Backward Packets"
    - "Total Length of Fwd Packets"
    - "Total Length of Bwd Packets"
    - "Fwd Packet Length Max"
    - "Fwd Packet Length Min"
    - "Fwd Packet Length Mean"
    - "Fwd Packet Length Std"
    - "Bwd Packet Length Max"
    - "Bwd Packet Length Min"
    - "Bwd Packet Length Mean"
    - "Bwd Packet Length Std"
    - "Flow Bytes/s"
    - "Flow Packets/s"
    - "Fwd Packets/s"
    - "Bwd Packets/s"
    - "Packet Length Mean"
    - "Packet Length Std"
    - "Packet Length Variance"
    - "Max Packet Length"
    - "Min Packet Length"
    - "Fwd Header Length"
    - "Bwd Header Length"
    - "Average Packet Size"
  protocol:
    - "Destination Port"
    - "FIN Flag Count"
    - "SYN Flag Count"
    - "RST Flag Count"
    - "PSH Flag Count"
    - "ACK Flag Count"
    - "URG Flag Count"
    - "CWE Flag Count"
    - "Init_Win_bytes_forward"
    - "Init_Win_bytes_backward"
  behavioral:
    - "Subflow Bwd Bytes"
    - "Down/Up Ratio"
    - "act_data_pkt_fwd"
    - "min_seg_size_forward"

# --- Model Architecture ---
model:
  d_emb: 128             # Optuna best
  nhead: 8               # Optuna best
  intra_group_layers: 2  # Optuna best (was 3)
  inter_group_layers: 2  # Optuna best (was 3)
  dim_feedforward: 512   # Optuna best (was 256)
  dropout: 0.1           # Optuna best (was 0.15)

# --- Training ---
training:
  # Phase 1: Classification
  phase1:
    optimizer: "adamw"
    learning_rate: 4.544e-4  # Optuna best
    weight_decay: 5.17e-5    # Optuna best
    batch_size: 512          # Optuna best
    max_epochs: 100
    warmup_epochs: 5
    scheduler: "cosine_warm_restarts"
    scheduler_T0: 10
    scheduler_Tmult: 2
    early_stopping_patience: 15
    gradient_clip_max_norm: 1.0

  # Phase 2: Explanation Fine-tuning
  phase2:
    learning_rate: 1.0e-5
    max_epochs: 15
    attention_entropy_lambda: 0.01  # λ for attention entropy regularization
    early_stopping_patience: 5

  # Focal Loss
  focal_loss:
    gamma: 4.5     # Optuna best (was 3.0)
    alpha: "auto"
    label_smoothing: 0.1  # Reduce overconfidence on rare classes

  # Data Augmentation / Balancing
  imbalance:
    method: "smote_tomek"  # "smote", "smote_tomek", "adasyn", or "none"
    random_state: 42

# --- Evaluation ---
evaluation:
  # Baselines to compare
  baselines:
    - "random_forest"
    - "xgboost"
    - "cnn_1d"
    - "bilstm"
    - "vanilla_transformer"
  # Metrics
  metrics:
    - "accuracy"
    - "precision_macro"
    - "recall_macro"
    - "f1_macro"
    - "f1_weighted"
    - "per_class_f1"
    - "confusion_matrix"

# --- XAI ---
xai:
  # Attention Rollout
  rollout:
    residual_weight: 0.5  # Weight for residual connection in rollout
    head_fusion: "mean"   # "mean", "max", or "min" for multi-head fusion

  # SHAP
  shap:
    method: "gradient"     # "deep" (DeepSHAP) or "gradient" (GradientExplainer)
    background_samples: 100
    test_samples: 500

  # Faithfulness Test
  faithfulness:
    top_k_values: [5, 10, 15, 20, 25]  # Number of features to mask
    masking_strategy: "zero"  # "zero", "mean", or "random"

  # XCS Metric
  xcs:
    correlation_method: "spearman"  # "spearman" or "kendall"

# --- Cross-Dataset ---
cross_dataset:
  datasets:
    - name: "UNSW-NB15"
      path: "data/raw/unsw_nb15"
    - name: "CIC-IDS2018"
      path: "data/raw/cic_ids2018"

# --- Experiment Tracking (W&B) ---
wandb:
  enabled: true
  project: "HiT-IDS"
  entity: null  # set to your wandb username/team
  tags: ["hierarchical-transformer", "ids", "xai"]
